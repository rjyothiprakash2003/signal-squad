app = "signal-squad-decode"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  TRUST_PROXY = "1"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
